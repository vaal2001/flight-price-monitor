
name: Deploy flight viewer

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Sequential Flight Search
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
  if: >-
    ${{
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show repository files
        run: ls -la

      - name: Install frontend dependencies
        working-directory: flight-viewer-module
        run: npm ci

      - name: Build frontend
        working-directory: flight-viewer-module
        run: npm run build

      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: flight-viewer-module/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
